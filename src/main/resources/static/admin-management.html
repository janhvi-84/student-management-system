<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Management</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <h2>SMS</h2>
            <p>Admin Panel</p>
        </div>

        <ul>

            <li>
                <a href="dashboard.html">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="dashboard.html">
                    🎓 Students
                </a>
            </li>

            <li class="active">
                👨‍💼 Admin Management
            </li>

            <li onclick="logout()">
                🚪 Logout
            </li>

        </ul>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header>

            <div>

                <div class="title-scroll">

                    <h1>
                        👨‍💼 Admin Management
                    </h1>

                </div>

                <p>
                    Create and manage administrators
                </p>

            </div>

        </header>


        <!-- ADMIN CONTENT -->
        <section class="admin-management">


            <!-- CREATE ADMIN -->
            <div class="quick-box">

                <div class="box-header">

                    <h2>
                        ➕ Create New Admin
                    </h2>

                </div>


                <form id="adminForm">

                    <input
                        type="text"
                        id="name"
                        placeholder="Admin Name"
                        required>


                    <input
                        type="email"
                        id="email"
                        placeholder="Admin Email"
                        required>


                    <input
                        type="tel"
                        id="phoneNumber"
                        placeholder="Phone Number"
                        required>


                    <textarea
                        id="address"
                        placeholder="Address"
                        required>
                    </textarea>


                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>


                    <button type="submit">
                        Create Admin
                    </button>

                </form>

            </div>


            <!-- ADMIN TABLE -->
            <div class="table-container">

                <h2>
                    👨‍💼 Admin Records
                </h2>


                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="adminTable">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script src="js/admin-management.js"></script>

</body>

</html>z
