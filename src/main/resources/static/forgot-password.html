<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="css/forgot-password.css">

</head>

<body>

<div class="container">

    <div class="forgot-card">

        <div class="logo">

            <div class="logo-circle">
                🔒
            </div>

            <h1>
                Forgot Password
            </h1>

            <p>
                Reset your account password using Email OTP
            </p>

        </div>

        <!-- STEP 1 -->

        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email">

        </div>

        <button
                class="btn"
                onclick="sendOtp()">

            Send OTP

        </button>

        <hr>
                <!-- STEP 2 -->

        <div class="form-group">

            <label>
                Enter OTP
            </label>

            <input
                    type="text"
                    id="otp"
                    maxlength="6"
                    placeholder="Enter 6 digit OTP">

        </div>

        <button
                class="btn"
                onclick="verifyOtp()">

            Verify OTP

        </button>

        <hr>

        <!-- STEP 3 -->

        <div id="resetSection"
             style="display:none;">

            <div class="form-group">

                <label>
                    New Password
                </label>

                <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password">

            </div>

            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password">

            </div>

            <button
                    class="btn success-btn"
                    onclick="resetPassword()">

                Reset Password

            </button>

        </div>
                <div class="bottom-link">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

<script src="js/forgot-password.js"></script>

</body>
</html>
